<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밈 파이트</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1efe9;--ink:#1c1c22;--card:#fff;--line:#1c1c22;--arena:#fbfaf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161c;--ink:#f1f1f5;--card:#23232c;--line:#f1f1f5;--arena:#1e1e28}}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;justify-content:center;user-select:none}
.wrap{width:min(100%,440px);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
h1{font-size:1.7rem;margin:6px 0 0;font-weight:400}
button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-size:1rem;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #2f6bff;outline-offset:2px}
.modes{display:flex;gap:6px}
.modes button.on{background:var(--ink);color:var(--bg)}
#slots{width:100%;display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid;border-radius:14px;padding:8px 10px}
.slot .em{font-size:1.5rem;padding:2px 8px;border-radius:12px}
.slot input{flex:1;min-width:0;font:inherit;font-size:1rem;background:transparent;color:var(--ink);border:none;border-bottom:2px solid var(--line);padding:4px}
.slot .hp{font-size:.9rem;opacity:.7;white-space:nowrap}
#go{font-size:1.3rem;padding:10px 40px;background:#ff5a3c;color:#fff;border-color:#ff5a3c}
#game{display:none;position:relative;width:100%}
canvas{width:100%;display:block;border:3px solid var(--line);border-radius:16px;background:var(--arena)}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:16px;font-size:1.8rem;text-align:center}
#end button{background:#fff;color:#111;border-color:#fff}
small{opacity:.7;text-align:center}
#pick{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;align-items:center;justify-content:center;padding:16px}
#pg{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:80vh;overflow:auto;max-width:420px;width:100%}
#pg button{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px;padding:8px 4px;font-size:.85rem}
#pg button span:first-child{font-size:1.6rem}
#ih{font-size:1.25rem;font-weight:400;margin:18px 0 0}
#info{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.ci{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;font-size:.92rem;line-height:1.5}
.ci b{font-size:1.1rem;font-weight:400}
.ci ul{margin:4px 0 0;padding-left:18px}
</style>
</head>
<body>
<div class="wrap">
 <h1>밈 파이트</h1>
 <div id="setup" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px">
  <div class="modes" id="modes"></div>
  <div id="slots"></div>
  <button id="go">시작하기</button>
  <small>캐릭터 버튼을 누르면 전체 목록이 열려요. 하나를 누르면 바로 선택돼요.<br>대부분 10초마다 랜덤 스킬, 트롤페이스는 15초마다 상대 스킬 따라하기, 더미는 능력이 없어요.</small>
  <h2 id="ih">캐릭터 설명</h2>
  <div id="info"></div>
 </div>
 <div id="game">
  <canvas id="c" width="400" height="620"></canvas>
  <div id="end"><div id="win"></div><button id="again">다시 하기</button></div>
  <div style="text-align:center;margin-top:8px"><button id="quit">나가기</button></div>
 </div>
</div>
<div id="pick"><div id="pg"></div></div>
<script>
const CT=[{n:'브레인롯',e:'🧠',d:'랜덤 스킬'},{n:'67',e:'67',d:'랜덤 스킬'},{n:'더미',e:'😐',d:'능력 없음'},{n:'감자',e:'🥔',d:'랜덤 스킬'},{n:'고양이',e:'🐱',d:'랜덤 스킬'},{n:'사생수',e:'🏫',d:'랜덤 스킬'},{n:'스키비디 토일렛',e:'🚽',d:'랜덤 스킬'},{n:'칠가이',e:'😌',d:'랜덤 스킬'},{n:'임포스터',e:'🔴',d:'랜덤 스킬'},{n:'도지',e:'🐕',d:'랜덤 스킬'},{n:'치킨 조키',e:'🐔',d:'랜덤 스킬'},{n:'릭롤',e:'🎤',d:'랜덤 스킬'},{n:'트롤페이스',e:'😏',d:'15초 따라하기'},{n:'티키티키 폰크',e:'🎧',d:'랜덤 스킬'},{n:'시간이세영',e:'⏳',d:'랜덤 스킬'},{n:'시크릿 주준영',e:'🚒',d:'랜덤 스킬'},{n:'태민',e:'💫',d:'보조 공'},{n:'승강기 탑승무원',e:'🛗',d:'랜덤 스킬'}];
const MODES={'1대1':[0,1],'2대2':[0,0,1,1],'1대1대1대1':[0,1,2,3]};
const TC=['#ff5a3c','#2f6bff','#2fb56b','#f2b705'],TN=['빨강','파랑','초록','노랑'];
const CH=[{n:'퉁퉁퉁 사후르',e:'🔨',k:0,d:'방망이'},{n:'봄바르디로',e:'🐊',k:1,d:'폭탄'},{n:'리릴리 라릴라',e:'🐘',k:2,d:'얼리기'},{n:'침팬치니',e:'🍌',k:3,d:'바나나'}];
const MAXHP=250,W=400,H=620,TOP=64,R=26;
let mode='2대2',slots=[],balls=[],fx=[],bombs=[],peels=[],shots=[],nums=[],cats=[],trails=[],holes=[],rooms=[],pens=[],runs=[],desks=[],quizzes=[],coins=[],rolls=[],skids=[],trucks=[],htrucks=[],letters=[],lifts=[],foods=[],helpers=[],shake=0,trash=[],npcs=[],t=0,running=false,AC=null;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function buildModes(){
 $('modes').innerHTML='';
 for(const m in MODES){const b=document.createElement('button');b.textContent=m;if(m===mode)b.className='on';b.onclick=()=>{mode=m;buildModes();buildSlots()};$('modes').appendChild(b)}
}
const INFO=[
['스킬 4개를 10초마다 랜덤으로 써요.','퉁퉁퉁 사후르: 방망이를 휘둘러 맞은 적에게 32 피해와 넉백','봄바르디로 크로코딜로: 맵에 폭탄 4개, 터지면 40 피해','리릴리 라릴라: 적 전체 5초 정지, 이때 부딪히면 피해 2배','침팬치니 바나니니: 바나나 껍질 3개, 밟으면 28 피해'],
['스킬 3개를 10초마다 랜덤으로 써요.','67 연타: 6번 약하게(9) 때리고 7번째에 크게(42) 날려요','양손 저울질: 충격파 6번, 한 번에 7 피해','숫자 비: 6과 7 숫자 12개가 떨어져요. 맞으면 숫자의 2배 피해'],
['능력이 없어요. 회색 몸에 팀 색 테두리로 팀을 구분해요.'],
['스킬 3개를 10초마다 랜덤으로 써요.','감자 던지기: 가까운 적에게 20 피해','감자 먹방: 체력 20 회복','나 너 좋아: 적이 2초 따라와요. 닿으면 내가 30 회복, 적은 30 피해'],
['스킬 8개를 10초마다 랜덤으로 써요.','오이아이아: 3초 동안 회전하며 닿는 적에게 피해 6','팝캣: 충격파 5번, 한 번에 8 피해','냥캣 돌진: 무지개 자국을 남겨요. 밟으면 5 피해','맥스웰 댄스: 가까운 적 2초 정지','바나나캣 울음: 체력이 가장 낮은 아군 +25 (혼자면 +15)','허?: 적이 3초 동안 엉뚱한 방향으로 가요','치피치피 챠파챠파: 고양이 5마리가 가로질러 달려요. 닿으면 15 피해','고양이 점프스케어: 가까운 적 10 피해 + 밀치기'],
['스킬 13개를 10초마다 랜덤으로 써요.','검은 원: 5초 동안 안의 적이 느려지고 조금씩 피해','상벌점 재판장: 적 한 명에게 30초 미션(쓰레기 8개 줍기 / 떠든 사람 피하기 / 교탁 앞에 서기). 실패하면 44 피해','종소리: 적 전체 잠깐 정지','교실 교칙: 5초 동안 교실 안에 있으면 무적','출석 체크: 3초 안에 교탁에 못 오면 30 피해','지각 벌점: 6초 동안 벽에 닿은 적이 피해','복도에서 뛰지 마: 5초 동안 빠른 적이 피해','조용히 해: 적 한 명의 다음 스킬 봉인','압수: 적 스킬 쿨타임 +5초, 적 함정 하나 제거','분필 던지기: 8 피해 + 2초 동안 엉뚱한 방향','칠판 지우개 먼지: 구름 안의 적이 느려지고 흔들려요','책상 바리케이드: 책상 4개가 10초 동안 놓여요','쪽지 시험: 2초 뒤 적마다 50% 확률로 15 피해'],
['스킬 2개를 10초마다 랜덤으로 써요.','스키비디 변기: 3초 동안 적을 끌어당기다가 폭발(35 피해)','물 내리기: 가까운 적 밀치기 + 10 피해'],
['패시브: 5번 맞으면 5초 동안 피해 70% 감소','스킬 2개를 10초마다 랜덤으로 써요.','그냥 그런 거지 뭐: 체력 15 회복 + 3초 동안 피해 70% 감소','관심 없음: 가까운 적이 2초 동안 헤매요'],
['스킬 2개를 10초마다 랜덤으로 써요.','위치 교환: 적 한 명과 자리를 바꿔요','투명 접근: 투명해져서 적에게 닿으면 30 피해'],
['스킬 2개를 10초마다 랜덤으로 써요.','코인 뿌리기: 코인 8개. 아군이 먹으면 +12, 적이 먹으면 8 피해','투 더 문: 4초 동안 빠르게 도는 돌진'],
['스킬 2개를 10초마다 랜덤으로 써요.','닭 돌진: 가까운 적에게 돌진해 15 피해 + 1초 정지','꼬꼬댁: 가까운 적 밀치기 + 8 피해'],
['스킬 2개를 10초마다 랜덤으로 써요.','릭롤: 가까운 적이 2초 동안 춤추다가 20 피해','릭롤 힐링: 아군 전체 +15 회복'],
['15초마다 상대 스킬을 따라해요.','모든 캐릭터의 스킬을 복사할 수 있어요. 적 중에 없는 캐릭터의 스킬도 따라해요','더미 3마리와 트롤페이스만 있어도 퉁퉁퉁 사후르 같은 스킬을 따라해요'],
['스킬 5개를 10초마다 랜덤으로 써요.','드리프트: 가까운 적에게 미끄러지듯 돌진하며 타이어 자국을 남겨요. 자국을 밟은 적은 느려져요','베이스 드롭: 잠깐 힘을 모은 뒤 쿵 내리쳐서 가까운 적에게 30 피해 + 밀치기','카우벨: 가까운 적이 3초 동안 박자에 맞춰 멈췄다 움직여요','티키티키 비트: 박자 4번, 갈수록 세져요(6, 12, 18, 24 피해)','믹스테이프 루프: 방금 쓴 스킬을 한 번 더 써요'],
['스킬 4개를 10초마다 랜덤으로 써요.','시간 정지: 적 전체가 2초 동안 멈춰요','되감기: 3초 전 위치로 돌아가요. 체력은 그때보다 낮아지지 않아요','가속: 5초 동안 빨라지고 스킬 주기도 2배로 빨라져요','시간 지연: 가까운 적이 4초 동안 느려지고 스킬 주기도 느려져요'],
['스킬 3개를 10초마다 랜덤으로 써요.','소방차는 빨간불에 멈추지 않아: 소방차가 맵 가장자리를 3바퀴 돌아요. 닿으면 22 피해','아우라 -9999: 주변에 어두운 아우라가 생겨요. 아우라에 닿은 적이 5번 쌓이면 번개가 내리치고 아우라 +9999로 각성해요. 각성하면 5초 동안 무적이 되고 "INFL 파워!"를 외치며 소방차가 5초 동안 옆으로 지나가요','INFL: 맵에 I, N, F, L 글자가 생겨요. 4개를 모두 먹으면 레이저빔을 발사해요(45 피해)'],
['스킬은 없어요. 보조 공이 주위를 돌며 대신 싸워요.','보조 공의 공격력은 처음 10이에요','보조 공이 적에게 닿을 때마다 50% 확률로 아우라가 1 올라가고, 아우라가 오를 때마다 공격력이 3 올라가요'],
['스킬 2개를 10초마다 랜덤으로 써요.','승강기 내리기: 맵 가운데에 승강기가 내려오고 승무원이 음식 3개를 줘요. 독음식은 적이 먹으면 20 피해, 맛있는 음식은 내가 먹으면 20 회복','승강기 타기: 승강기를 타고 맵 밖으로 올라갔다가 적 위치로 떨어져요. 깔리면 30 피해. 올라가기 전 가운데 승강기에 적이 타면 승강기 고장으로 50 피해를 입고 아래에서 다시 올라와요']
];
$('info').innerHTML=CT.map((c,i)=>c.sec?'':'<div class="ci"><b>'+c.e+' '+c.n+'</b><ul>'+INFO[i].map(s=>'<li>'+s+'</li>').join('')+'</ul></div>').join('');
function openPick(i,e,inp,hp,tm){
 const g=$('pg');g.innerHTML='';
 [15,...CT.map((c,i)=>i).filter(i=>i!==15)].forEach(ci=>{const c=CT[ci];const b=document.createElement('button');b.innerHTML='<span>'+c.e+'</span><span>'+c.n+'</span>';
  b.onclick=()=>{const s=slots[i];s.ch=ci;s.name=c.n;e.textContent=c.e;inp.value=c.n;hp.textContent=c.d+' · '+TN[tm]+'팀';$('pick').style.display='none'};g.appendChild(b)});
 $('pick').style.display='flex';
}
$('pick').onclick=ev=>{if(ev.target===$('pick'))$('pick').style.display='none'};
function buildSlots(){
 const teams=MODES[mode];
 teams.forEach((tm,i)=>{if(!slots[i])slots[i]={ch:0,name:CT[0].n}});
 $('slots').innerHTML='';
 teams.forEach((tm,i)=>{
  const d=document.createElement('div');d.className='slot';d.style.borderColor=TC[tm];
  const e=document.createElement('button');e.className='em';e.textContent=CT[slots[i].ch].e;e.style.background=TC[tm]+'33';
  e.onclick=()=>openPick(i,e,inp,hp,tm);
  const inp=document.createElement('input');inp.value=slots[i].name;inp.maxLength=12;inp.setAttribute('aria-label',TN[tm]+'팀 이름');
  inp.oninput=()=>{const v=inp.value.trim(),si=CT.findIndex(c=>c.sec&&(c.n===v||v==='주준영'));if(si>=0){slots[i].ch=si;e.textContent=CT[si].e;hp.textContent=CT[si].d+' · '+TN[tm]+'팀'}slots[i].name=inp.value||CT[slots[i].ch].n};
  const hp=document.createElement('span');hp.className='hp';hp.textContent=CT[slots[i].ch].d+' · '+TN[tm]+'팀';
  d.append(e,inp,hp);$('slots').appendChild(d);
 });
}
function beep(f,d){
 try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.06;
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}
}
function spawnPos(){let x,y,k=0;do{x=60+Math.random()*(W-120);y=TOP+60+Math.random()*(H-TOP-120)}while(balls.some(o=>Math.hypot(o.x-x,o.y-y)<100)&&++k<50);return{x,y}}
function start(){
 const teams=MODES[mode],n=teams.length;balls=[];fx=[];bombs=[];peels=[];shots=[];nums=[];cats=[];trails=[];holes=[];rooms=[];pens=[];runs=[];desks=[];quizzes=[];coins=[];rolls=[];skids=[];trucks=[];htrucks=[];letters=[];lifts=[];foods=[];helpers=[];shake=0;trash=[];npcs=[];t=0;
 teams.forEach((tm,i)=>{
  const a=Math.random()*6.28;
  balls.push({team:tm,name:slots[i].name,em:CT[slots[i].ch].e,type:slots[i].ch,combo:null,hp:MAXHP,alive:true,
   ...spawnPos(),vx:Math.cos(a)*4,vy:Math.sin(a)*4,cd:0,flash:0,skT:300+Math.random()*300,fz:0,bat:null});
 });
 balls.forEach(b=>{if(b.type===16)helpers.push({o:b,a:Math.random()*6.28,x:b.x,y:b.y,cd:0})});
 $('setup').style.display='none';$('game').style.display='block';$('end').style.display='none';
 running=true;beep(520,.15);
}
function fxText(x,y,s,c){fx.push({x,y,s,c,life:40,type:'t'})}
function burst(x,y,c){for(let i=0;i<22;i++){const a=Math.random()*6.28,v=2+Math.random()*5;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c,life:30,type:'p'})}}

function tpos(s){
 const x0=40,x1=360,y0=TOP+40,y1=H-40,w=x1-x0,h=y1-y0;
 s=s%(2*(w+h));
 if(s<w)return[x0+s,y0];
 s-=w;if(s<h)return[x1,y0+s];
 s-=h;if(s<w)return[x1-s,y1];
 s-=w;return[x0,y1-s];
}

  if(b.cd>0)b.cd--;if(b.flash>0)b.flash--;
  if(b.hide>0){b.hide--;b.vx=b.vy=0;if(!b.hide)unhide(b);continue}
  skill(b);
  if(b.fz>0){b.fz--;b.vx=b.vy=0;if(!b.fz){const a=Math.random()*6.28;b.vx=Math.cos(a)*4;b.vy=Math.sin(a)*4}continue}
  b.x+=b.vx;b.y+=b.vy;
  if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)}if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx)}
  if(b.y<TOP+R){b.y=TOP+R;b.vy=Math.abs(b.vy)}if(b.y>H-R){b.y=H-R;b.vy=-Math.abs(b.vy)}
  const sp=Math.hypot(b.vx,b.vy)||1,tg=sp<base?sp+.05:sp*.995;
  b.vx*=tg/sp;b.vy*=tg/sp;
 }
 for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
  const a=balls[i],b=balls[j];if(!a.alive||!b.alive||a.hide>0||b.hide>0)continue;
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),mn=R*2;
  if(d<mn&&d>0){
   const nx=dx/d,ny=dy/d,o=(mn-d)/2;
   a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
   const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
   if(rv<0){a.vx+=rv*nx;a.vy+=rv*ny;b.vx-=rv*nx;b.vy-=rv*ny}
   if(a.team!==b.team&&a.cd===0&&b.cd===0){
    a.cd=b.cd=14;
    for(const [x,o2] of [[a,b],[b,a]]){
     const dm=Math.round((8+Math.abs(rv)*1.6+Math.random()*8+t/300)*(x.fz>0&&!x.dn?2:1)*(x.chill>0?.3:1));
     if(x.inv){fxText(x.x,x.y-R-6,'무적','#4aa3ff')}else{x.hp=Math.max(0,x.hp-dm);x.flash=8;fxText(x.x,x.y-R-6,'-'+dm,'#ff3b3b');if(x.type===7){x.st=(x.st||0)+1;if(x.st>=5){x.st=0;x.chill=300;fxText(x.x,x.y-R-30,'그냥 그런 거지 뭐~','#2fb56b')}}}
    }
    beep(200+Math.random()*200,.08);
   }
  }
 }
 for(const b of balls)if(b.alive&&b.hp<=0){b.alive=false;burst(b.x,b.y,TC[b.team]);beep(110,.3)}
 const alive=[...new Set(balls.filter(b=>b.alive).map(b=>b.team))];
 if(running&&alive.length<=1){
  running=false;
  setTimeout(()=>{
   $('win').innerHTML=alive.length?'<div style="font-size:3rem">🏆</div>'+TN[alive[0]]+'팀 승리!':'무승부';
   $('end').style.display='flex';beep(660,.4);
  },700);
 }
 for(const f of fx){f.life--;if(f.type==='t')f.y-=.8;else if(f.type==='r')f.r+=8;else if('jLBZ'.includes(f.type)){}else{f.x+=f.vx;f.y+=f.vy;f.vx*=.95;f.vy*=.95}}
 fx=fx.filter(f=>f.life>0);
}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;if(shake>0){shake--;ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*12)}

 teams.forEach((tm,k)=>{

 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const m of bombs){

  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,80,0,.7)';ctx.setLineDash([6,6]);ctx.stroke();ctx.setLineDash([]);

 }
 ctx.font='24px sans-serif';
 for(const p of peels)ctx.fillText('🍌',p.x,p.y);
 for(const s of shots)ctx.fillText(s.ch?'✏️':'🥔',s.x,s.y);
 ctx.font='bold 30px Jua, sans-serif';ctx.fillStyle='#7a3cff';
 for(const n of nums)ctx.fillText(n.d,n.x,n.y);
 for(const g of trails){ctx.globalAlpha=Math.min(1,g.life/60);ctx.fillStyle='hsl('+g.h+',90%,60%)';ctx.beginPath();ctx.arc(g.x,g.y,12,0,7);ctx.fill()}
 ctx.globalAlpha=1;ctx.font='26px sans-serif';
 for(const c of cats)ctx.fillText('🐈',c.x,c.y);
 for(const h of holes){ctx.globalAlpha=Math.min(h.dust?.6:.85,h.life/40);ctx.fillStyle=h.dust?'#9a9a9a':'#0a0612';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=h.dust?'#d0d0d0':'#7a3cff';ctx.stroke()}
 ctx.globalAlpha=1;
 if(pens.length){ctx.strokeStyle='rgba(255,60,60,.4)';ctx.lineWidth=16;ctx.strokeRect(8,TOP+8,W-16,H-TOP-16)}
 for(const d of desks){ctx.fillStyle='#b9854a';ctx.fillRect(d.x-d.w/2,d.y-d.h/2,d.w,d.h);ctx.lineWidth=3;ctx.strokeStyle=css('--line');ctx.strokeRect(d.x-d.w/2,d.y-d.h/2,d.w,d.h)}
 if(runs.length){ctx.font='16px Jua, sans-serif';ctx.fillStyle='#ff3b3b';ctx.fillText('🚫 복도에서 뛰지 마!',W/2,TOP+20)}
 ctx.font='22px sans-serif';
 ctx.globalAlpha=1;ctx.font='22px sans-serif';
 for(const r of rooms){ctx.globalAlpha=.18;ctx.fillStyle='#4aa3ff';ctx.fillRect(r.x-r.w/2,r.y-r.h/2,r.w,r.h);ctx.globalAlpha=1;ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.strokeStyle='#4aa3ff';ctx.strokeRect(r.x-r.w/2,r.y-r.h/2,r.w,r.h);ctx.setLineDash([]);ctx.fillText('🏫',r.x,r.y-r.h/2+14)}
 for(const r of trash)if(!r.d)ctx.fillText('🧻',r.x,r.y);
 ctx.globalAlpha=.35;ctx.fillStyle='#222';for(const g of skids){ctx.beginPath();ctx.arc(g.x,g.y,10,0,7);ctx.fill()}ctx.globalAlpha=1;
 for(const c of coins)ctx.fillText('🪙',c.x,c.y);
 ctx.textAlign='center';
 for(const b of balls){
  const u=b.au;if(!b.alive||!u)continue;
  const AR=(u.gold?95:70)+R,g=ctx.createRadialGradient(b.x,b.y,R,b.x,b.y,AR);
  g.addColorStop(0,u.gold?'rgba(255,214,74,.7)':'rgba(80,0,120,.6)');g.addColorStop(1,u.gold?'rgba(255,214,74,.05)':'rgba(0,0,0,.05)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,AR,0,7);ctx.fill();
  ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.strokeStyle=u.gold?'#ffd54a':'#7a3cff';ctx.stroke();ctx.setLineDash([]);
  ctx.font='bold 14px Jua, sans-serif';ctx.fillStyle=u.gold?'#b8860b':'#c9a0ff';ctx.fillText(u.gold?'+9999':'-9999',b.x,b.y-AR-8);
 }
 ctx.font='24px sans-serif';
 for(const f of foods)ctx.fillText(f.k?'🍖':'🍄',f.x,f.y);
 for(const l of lifts){ctx.font='56px sans-serif';ctx.fillText('🛗',l.x,l.y-(l.kind===0?Math.max(0,l.t-70)*10:0))}
 ctx.font='bold 26px Jua, sans-serif';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.fillStyle='#ffd54a';
 for(const L of letters){ctx.strokeText(L.ch,L.x,L.y);ctx.fillText(L.ch,L.x,L.y)}
 ctx.font='34px sans-serif';
 for(const k of htrucks)ctx.fillText('🚒',k.x,k.y);
 for(const h of helpers){const lv=h.o.tl||0;ctx.beginPath();ctx.arc(h.x,h.y,13+Math.min(lv,10),0,7);ctx.fillStyle='rgba(255,179,0,.25)';ctx.fill();ctx.beginPath();ctx.arc(h.x,h.y,13,0,7);ctx.fillStyle=TC[h.o.team];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=css('--line');ctx.stroke();ctx.font='12px Jua, sans-serif';ctx.fillStyle='#ffb300';ctx.fillText('Lv'+lv,h.x,h.y-22)}
 ctx.font='22px sans-serif';
 for(const k of trucks){ctx.globalAlpha=.4;ctx.fillStyle=t%20<10?'#ff3b3b':'#3b6bff';ctx.beginPath();ctx.arc(k.x,k.y,24,0,7);ctx.fill();ctx.globalAlpha=1;ctx.font='34px sans-serif';ctx.fillText('🚒',k.x,k.y)}
 ctx.font='22px sans-serif';
 for(const n of npcs)ctx.fillText('🗣️',n.x,n.y);
 if(balls.some(b=>b.job&&b.job.m===2)){ctx.beginPath();ctx.arc(W/2,(H+TOP)/2,40,0,7);ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.strokeStyle='#7a3cff';ctx.stroke();ctx.setLineDash([]);ctx.fillText('🪧',W/2,(H+TOP)/2)}
 ctx.font='24px sans-serif';
 ctx.textBaseline='alphabetic';
 for(const b of balls){
  if(!b.alive)continue;
  ctx.globalAlpha=b.hide>0?0:b.gh>0?.25:1;ctx.beginPath();ctx.arc(b.x+2,b.y+4,R,0,7);ctx.fillStyle='rgba(0,0,0,.18)';ctx.fill();
  ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.fillStyle=b.flash?'#fff':(b.type===2?'#9aa0a6':TC[b.team]);ctx.fill();
  ctx.lineWidth=b.type===2?6:3;ctx.strokeStyle=b.type===2?TC[b.team]:css('--line');ctx.stroke();
  ctx.font='26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.em,b.x,b.y+1);
  if(b.fz>0){ctx.fillStyle='rgba(120,200,255,.55)';ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.fill();ctx.fillText(b.dn===3?'⏳':b.dn===2?'🔔':b.dn?'🎵':'🧊',b.x,b.y)}
  if(b.bat){const a=b.bat.life*.35;ctx.strokeStyle='#8a5a2b';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x+Math.cos(a)*R,b.y+Math.sin(a)*R);ctx.lineTo(b.x+Math.cos(a)*(R+44),b.y+Math.sin(a)*(R+44));ctx.stroke();ctx.lineCap='butt'}
  if(b.love)ctx.fillText('💘',b.x,b.y-R-28);
  if(b.conf>0)ctx.fillText('❓',b.x,b.y-R-28);
  if(b.inv){ctx.strokeStyle='#4aa3ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(b.x,b.y,R+5,0,7);ctx.stroke()}
  if(b.chill>0){ctx.strokeStyle='#7ee08a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(b.x,b.y,R+5,0,7);ctx.stroke()}
  if(b.bd>0){ctx.strokeStyle='#9b5cff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,140*b.bd/45,0,7);ctx.stroke()}
  if(b.cb>0)ctx.fillText('🔔',b.x+R,b.y-R-28);
  if(b.hs>0)ctx.fillText('⚡',b.x-R,b.y-R-28);
  if(b.sl>0)ctx.fillText('🐌',b.x+R,b.y-R-28);
  if(b.sealed)ctx.fillText('🤐',b.x-R,b.y-R-28);
  if(quizzes.some(q=>q.team!==b.team))ctx.fillText('📝',b.x+R,b.y-R-28);
  if(b.spin>0)ctx.fillText('🌀',b.x+R,b.y-R);
  if(b.job){ctx.font='13px Jua, sans-serif';ctx.fillStyle='#7a3cff';ctx.fillText(['🧻 '+b.job.got+'/8','🗣️ 피하기','🪧 교탁'][b.job.m]+' '+Math.ceil(b.job.t/60)+'s',b.x,b.y-R-34)}
  if(b.combo){ctx.strokeStyle=TC[b.team];ctx.lineWidth=3;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(b.x,b.y,R*2+30,0,7);ctx.stroke();ctx.setLineDash([])}
  if(b.type!==2&&b.type!==16){ctx.fillStyle='#9b5cff';ctx.fillRect(b.x-24,b.y+R+3,48*(1-Math.max(0,b.skT)/600),4)}
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(b.x-24,b.y-R-14,48,6);
  ctx.fillStyle=TC[b.team];ctx.fillRect(b.x-24,b.y-R-14,48*b.hp/MAXHP,6);

 }
 for(const f of fx){
  if(f.type==='t'){ctx.globalAlpha=f.life/40;ctx.fillStyle=f.c;ctx.font='18px Jua, sans-serif';ctx.textAlign='center';ctx.fillText(f.s,f.x,f.y)}
  else if(f.type==='L'){ctx.globalAlpha=f.life/14;ctx.strokeStyle='#fff6a8';ctx.lineWidth=7;ctx.beginPath();let yy=TOP,xx=f.x;ctx.moveTo(xx,yy);while(yy<f.y-40){yy+=45;xx=f.x+(Math.random()-.5)*50;ctx.lineTo(xx,yy)}ctx.lineTo(f.x,f.y);ctx.stroke()}
  else if(f.type==='B'){ctx.globalAlpha=Math.min(1,f.life/20);ctx.font='bold 46px Jua, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=8;ctx.strokeStyle='#000';ctx.strokeText(f.s,W/2,H/2-60);ctx.fillStyle='#ffd54a';ctx.fillText(f.s,W/2,H/2-60);ctx.textBaseline='alphabetic'}
  else if(f.type==='Z'){ctx.globalAlpha=f.life/20;ctx.lineCap='round';ctx.strokeStyle='#ff2d55';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();ctx.lineCap='butt'}
  else if(f.type==='j'){ctx.globalAlpha=f.life/20*.8;ctx.font='220px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('😾',W/2,H/2);ctx.textBaseline='alphabetic'}
  else if(f.type==='r'){ctx.globalAlpha=f.life/12;ctx.strokeStyle=f.c;ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.stroke()}
  else{ctx.globalAlpha=f.life/30;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,4,0,7);ctx.fill()}
  ctx.globalAlpha=1;
 }
}
function loop(){if(balls.length){step();draw()}requestAnimationFrame(loop)}
$('go').onclick=start;
